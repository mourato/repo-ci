# Secret scan with gitleaks on every PR. Called from each project repo.
# Private repos on the Free plan have no GitHub secret scanning; this fills that gap.
name: secret-scan

on:
  workflow_call:

jobs:
  gitleaks:
    # Low Actions quota labels the PR local-review; the merge script then
    # runs gitleaks locally instead.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'local-review') }}
    # A new push cancels the scan of the older commit.
    concurrency:
      group: secret-scan-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Pinned CLI instead of gitleaks-action, which needs a license for
      # organization accounts. Bump GITLEAKS_VERSION by hand.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" gitleaks
      # Scan only the commits this PR adds. --redact keeps secret values out of the log.
      - name: Scan PR commits
        run: >-
          ./gitleaks git --redact --no-banner --verbose
          --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
