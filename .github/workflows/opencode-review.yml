# Automatic PR review with OpenCode Go. Called from each project repo.
# The prompt adapts the two-axis /code-review skill (Standards + Spec) to one CI run.
name: opencode-review

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: opencode-go/deepseek-v4.1-flash
    secrets:
      OPENCODE_API_KEY:
        required: true

jobs:
  review:
    # Fork and Dependabot PRs get no secrets, so skip them instead of failing.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    # A new push cancels the review of the older commit.
    concurrency:
      group: opencode-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Pinned install instead of anomalyco/opencode/github@latest: that action
      # asks the GitHub API for the latest release first and fails when the
      # call is rate-limited. Bump OPENCODE_VERSION by hand.
      - name: Install opencode
        env:
          OPENCODE_VERSION: 1.19.5
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION" --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Run opencode
        run: opencode github run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ inputs.model }}
          VARIANT: high
          # The review runs unattended: a permission prompt would hang until the
          # job timeout. Deny access outside the checkout so the request fails fast.
          OPENCODE_PERMISSION: '{"external_directory":"deny"}'
          USE_GITHUB_TOKEN: 'true'
          PROMPT: |
            Review pull request #${{ github.event.pull_request.number }} on two separate axes: Standards and Spec.
            Do not edit files, commit, or push. Do not write to GitHub yourself: no `gh pr comment`, `gh pr review`, or POST via `gh api`.
            Your final response is the review: opencode posts it as the PR comment, so it must contain the review text only.

            ## 1. Round
            Read earlier comments on this PR (`gh pr view ${{ github.event.pull_request.number }} --comments`) and find the newest
            line `REVIEW_SUMMARY head=<sha> ...`. Call that SHA PREV.
            - Round 1: no PREV, or PREV is not an ancestor of the head
              (`git merge-base --is-ancestor PREV ${{ github.event.pull_request.head.sha }}` fails, for example after a rebase).
              Review the full diff: `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD` and
              `git log origin/${{ github.event.pull_request.base.ref }}..HEAD --oneline`.
            - Closure round: PREV is an ancestor of the head. This is a closure check, not a fresh review.
              Read the delta only: `git diff PREV..${{ github.event.pull_request.head.sha }}`. Use the full diff only as context.
            The reviewed head is `${{ github.event.pull_request.head.sha }}`.

            ## 2. Previous findings (closure round only)
            For each finding in the PREV review, report `resolved` or `still open`, keeping its ID.
            The author answers each review in a comment that starts with `CI triage`. A finding it
            marks `deferred`, `dropped`, or `dismissed` is settled: list it once as `settled` with
            that disposition, and never report it again under Standards or Spec.
            Report a new finding only when it is inside the delta, or when it is a security or
            data loss defect anywhere. Do not report anything else outside the delta.

            ## 3. Spec source
            The spec is the originating requirement this change implements, never the code itself.
            Look for it in this order and use every source you find:
            1. Issues referenced in the commits, PR title, or PR body (`#123`, `Closes #45`), read with `gh issue view`.
            2. A spec or plan file under `docs/`, `specs/`, or `.scratch/` that matches the branch name
               (`${{ github.event.pull_request.head.ref }}`) or the feature.
            3. The PR title and body (`gh pr view ${{ github.event.pull_request.number }}`), only if it states requirements.
            If none of these states a requirement, report "No spec available" for the Spec axis.

            ## 4. Standards sources
            Read every file in the repo that documents how code should be written:
            AGENTS.md, CLAUDE.md, CODING_STANDARDS.md, CONTRIBUTING.md, and docs they point to.
            Apply any `## Review focus` section first: it lists mistakes this repo has seen before.
            Skip anything that linters or formatters already enforce.

            ## 5. What to look for, in priority order
            1. Bugs, security problems, and data loss risks.
            2. Violations of a documented repo standard, citing the file and rule.
            3. A behavior change without an update to README.md or docs/, unless the PR states why.
            4. Code smells from this baseline (Fowler, Refactoring ch. 3). A documented repo standard
               always wins over it. Each smell is a judgement call ("possible Feature Envy"), never a hard violation:
               - Mysterious Name: name does not reveal what it does or holds. Fix: rename.
               - Duplicated Code: same logic shape in more than one hunk or file. Fix: extract shared shape.
               - Feature Envy: method uses another object's data more than its own. Fix: move it to that data.
               - Data Clumps: same fields or params travel together. Fix: bundle into one type.
               - Primitive Obsession: primitive or string stands for a domain concept. Fix: give it a type.
               - Repeated Switches: same switch/if-cascade on the same type recurs. Fix: polymorphism or one shared map.
               - Shotgun Surgery: one logical change forces scattered edits. Fix: gather into one module.
               - Divergent Change: one module edited for unrelated reasons. Fix: split it.
               - Speculative Generality: abstraction or hooks the spec does not need. Fix: delete or inline.
               - Message Chains: long a.b().c().d() navigation. Fix: hide the walk behind one method.
               - Middle Man: function or class that mostly delegates. Fix: call the real target.
               - Refused Bequest: subclass ignores most of what it inherits. Fix: use composition.

            ## 6. Evidence rules
            - Report a finding only with a concrete, reachable failure path or a quoted rule it breaks.
              A preference without a concrete defect is not a finding.
            - You see only this repository. Code it calls from elsewhere (for example a shared
              workflow in another repo) is out of view: do not report it as missing. If a finding
              depends on such code, mark it `unverifiable`.

            ## 7. Review each axis independently
            Standards: per file/hunk, violations of documented standards, bugs, and smells.
            Spec: (a) requirements missing or partial; (b) behaviour not asked for (scope creep);
            (c) requirements that look implemented but wrong. Quote the spec line for each finding.
            Put bugs, security, and data loss findings under the axis they fit.

            Severity for every finding:
            - `blocker`: breaks the intended behavior or contract, or a security or data loss risk.
            - `should`: a real defect or standard violation that should be fixed in this PR.
            - `nit`: minor; fixing it is optional.

            Format every finding as one item:
            `<ID> [<severity>] <path>:<line> — <problem>. Fix: <fix>.`
            IDs are `S1`, `S2`, ... for Standards and `P1`, `P2`, ... for Spec.

            ## 8. Comment
            Write the review as your final response in English, under 800 words, with exactly these sections:
            `## Previous findings` (closure round only), `## Standards`, `## Spec`, and a final one-line
            summary with the number of findings per axis and the worst issue within each axis.
            Do not merge or rerank findings across axes. If an axis has no findings, say so in one line.
            End the comment with this exact line, filled in:
            `REVIEW_SUMMARY head=${{ github.event.pull_request.head.sha }} round=<1|closure> blocker=<n> should=<n> nit=<n>`
